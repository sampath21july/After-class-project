<!DOCTYPE html>
<html lang="en">

<head>
    <title>Slider</title>
</head>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js">
</script>

<body>
    <h2>Pictures</h2>
    <div class="container"></div>
    <div id="mypictures" class="pictures slide"></div>
    <!--Indicators-->
    <ol class="carousel-indicators">
        <li data-target="#mypictures" class="active"></li>
        <li data-target="#mypictures"></li>
        <li data-target="#mypictures"></li>
    </ol>
    <!---Wrapper for slides-->
    <div class="carousel-inner"></div>
    <div class="item active">
        <img src="pic.jpg" alt="Image 1">
    </div>
    <div class="item">
        <img src="pic1.jpg" alt="Image 2">
    </div>
    <div class="item">
        <img src="pic2.jpg" alt="Image 3">
    </div>
    <!--Left and right controls-->
    <a class="Left carousel-control" href="" data-slide="prev">
        <span class="glyphicon glyphicon-chevron-lefft"></span>
        <span class="sr-only">Previous</span>
    </a>
    <a class="right carousel-control" href="#mypictures" data-slide="next">
        <span class="glyphicon glyphicon-chevron-right"></span>
        <span class="sr-only">Next</span>
    </a>
</body>

</html>
