<!DOCTYPE html>
<html>
    <body>
        <h2>Random number using while loop.</h2>
        <p id="number"></p>
        <script>
            var text ="";
            var i= 0;
            while (i < 10){
                text += "<br>The number is " +Math.random();
                i++;
            }
            document.getElementById("number").innerHTML = text;
        </script>
    </body>
</html>
