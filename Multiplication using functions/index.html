<!DOCTYPE html>
<html>
    <body>
        <h1>Multiplication</h1>
        <p>Product of two numbers</p>
        <p>Numbers are: 345 and 67</p>
        <p id="Multiple"></p>
        <script>
            var num = 345;
            var num1 = 67;
            var multiplication = num * num1;
            document.getElementById("Multiple").innerHTML = "The product is " + multiplication;
        </script>
    </body>
</html>
