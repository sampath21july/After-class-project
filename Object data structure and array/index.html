<!DOCTYPE html>
<html>
    <body>
        <h2>Fruits</h2>
        <p>Fruits are the seed-bearing structures of flowering plants, playing a crucial role in human diets and agriculture, and come in a wide variety of types and flavors.</p>
        <p id="join"></p>
        <p id="pop"></p>
        <p id="demo"></p>
        <script>
            var fruits = ["Papaya","Mango","Watermelon","Starwberry","Blueberry","Cherry","Kiwi"];
            document.getElementById("join").innerHTML = fruits.join("$");
            document.getElementById("pop").innerHTML = fruits.pop();
            document.getElementById("demo").innerHTML = fruits[4];
        </script>
    </body>
</html>
