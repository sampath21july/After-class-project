<!DOCTYPE html>
<html>
    <body>
        <h1>Addition</h1>
        <p>Sum of two Numbers</p>
        <p>Numbers are:-10 and 9</p>
        <p id="result"></p>
        <script>
            var num1 = 10;
            var num2 = 9;
            var sum = num1 + num2;
            document.getElementById("result").innerHTML ="The total sum is;" + sum;
        </script>
    </body>
    <body>
        <h1>Use of operator</h1>
        <p>We use the operator + with an example.</p>
        <p id="operator"></p>
        <script>
            var p = 13;
            var n = 11;
            var s = p + n;
            document.getElementById("operator").innerHTML = s;
        </script>
    </body>
</html>
